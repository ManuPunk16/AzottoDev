<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#050505"/>
      <stop offset="50%" stop-color="#0c0d12"/>
      <stop offset="100%" stop-color="#000000"/>
    </linearGradient>
    <linearGradient id="emeraldGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10B981"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="40%" r="50%">
      <stop offset="0%" stop-color="#10B981" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect width="1200" height="630" fill="url(#glow)"/>

  <!-- Tactical Grid -->
  <g stroke="#1e2025" stroke-width="1" opacity="0.4">
    <line x1="80" y1="0" x2="80" y2="630"/>
    <line x1="1120" y1="0" x2="1120" y2="630"/>
    <line x1="0" y1="80" x2="1200" y2="80"/>
    <line x1="0" y1="550" x2="1200" y2="550"/>
  </g>

  <!-- Tagline Badge -->
  <rect x="80" y="70" width="360" height="34" rx="6" fill="#1e2025" stroke="#27272a"/>
  <circle cx="98" cy="87" r="5" fill="#10B981"/>
  <text x="114" y="92" fill="#10B981" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700" letter-spacing="1.5">OFFLINE-FIRST PWA · ZERO-CLOUD</text>

  <!-- Project Title -->
  <text x="80" y="180" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="64" font-weight="800" letter-spacing="-1">SOVEREIGN</text>
  <text x="80" y="225" fill="#a1a1aa" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="22" font-weight="500">Biomechanical Workout Tracker &amp; Muscle Volume Engine</text>

  <!-- Abstract Vector Silhouette Preview (Right Side) -->
  <g transform="translate(850, 150)" stroke="#10B981" stroke-width="1.5" fill="none" opacity="0.85">
    <!-- Stylized Anatomy Silhouette Lines -->
    <ellipse cx="100" cy="40" rx="28" ry="36" stroke="#27272a" fill="#090a0f"/>
    <!-- Delts & Chest -->
    <path d="M 60 85 C 40 95, 20 120, 15 150 C 35 155, 65 145, 80 135 Z" fill="#10B981" fill-opacity="0.25"/>
    <path d="M 140 85 C 160 95, 180 120, 185 150 C 165 155, 135 145, 120 135 Z" fill="#10B981" fill-opacity="0.25"/>
    <!-- Pectorals -->
    <path d="M 80 110 C 60 115, 55 140, 75 155 C 95 150, 100 130, 80 110 Z" fill="#10B981" fill-opacity="0.4"/>
    <path d="M 120 110 C 140 115, 145 140, 125 155 C 105 150, 100 130, 120 110 Z" fill="#10B981" fill-opacity="0.4"/>
    <!-- Core / Abs -->
    <rect x="85" y="165" width="30" height="90" rx="4" stroke="#27272a" fill="#090a0f"/>
    <line x1="85" y1="195" x2="115" y2="195" stroke="#f59e0b"/>
    <line x1="85" y1="225" x2="115" y2="225" stroke="#f59e0b"/>
    <!-- Legs / Quads -->
    <path d="M 65 270 C 50 320, 55 380, 70 420 C 85 400, 95 340, 90 270 Z" fill="#10B981" fill-opacity="0.3"/>
    <path d="M 135 270 C 150 320, 145 380, 130 420 C 115 400, 105 340, 110 270 Z" fill="#10B981" fill-opacity="0.3"/>
  </g>

  <!-- Metric Badges -->
  <g transform="translate(80, 280)">
    <!-- Metric 1: LOC -->
    <rect x="0" y="0" width="220" height="85" rx="8" fill="#0c0d12" stroke="#1e2025"/>
    <text x="20" y="32" fill="#71717a" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600" letter-spacing="1">ARQUITECTURA TS</text>
    <text x="20" y="65" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="28" font-weight="800">83,542 LOC</text>

    <!-- Metric 2: Exercises -->
    <rect x="240" y="0" width="220" height="85" rx="8" fill="#0c0d12" stroke="#1e2025"/>
    <text x="260" y="32" fill="#71717a" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600" letter-spacing="1">CATALOGO MOTOR</text>
    <text x="260" y="65" fill="#10B981" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="28" font-weight="800">2,160 Items</text>

    <!-- Metric 3: Vector paths -->
    <rect x="480" y="0" width="220" height="85" rx="8" fill="#0c0d12" stroke="#1e2025"/>
    <text x="500" y="32" fill="#71717a" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600" letter-spacing="1">HEATMAP ANATOMICO</text>
    <text x="500" y="65" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="28" font-weight="800">126 Trazados</text>
  </g>

  <!-- Technical Capabilities Footer Bar -->
  <g transform="translate(80, 420)">
    <text x="0" y="0" fill="#71717a" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600" letter-spacing="1">HIGHLIGHTS DE INGENIERIA</text>
    <text x="0" y="30" fill="#e4e4e7" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="15" font-weight="400">
      • Algoritmo de Hitos Fisiologicos MEV/MAV/MRV (Dr. Mike Israetel)
    </text>
    <text x="0" y="55" fill="#e4e4e7" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="15" font-weight="400">
      • Persistencia SQLite / IndexedDB Local-First con Dexie.js (Zero Latency)
    </text>
    <text x="0" y="80" fill="#e4e4e7" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="15" font-weight="400">
      • Web Worker Timer Inmune a Throttling en PWA + Web Audio API 880Hz
    </text>
  </g>

  <!-- Tech Badges -->
  <g transform="translate(80, 565)">
    <text x="0" y="0" fill="#52525b" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="500">
      Angular 22 · Signals Zoneless · Tailwind CSS 4 · Dexie.js · Web Workers · Chart.js · PWA
    </text>
  </g>
</svg>
